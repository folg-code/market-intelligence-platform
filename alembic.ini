[alembic]
# Migration scripts live under migrations/, separate from the src/ package
# layout (S001-T004). The database URL is intentionally NOT set here: it
# would either hardcode a secret or duplicate the typed settings object.
# migrations/env.py builds it from moj_projekt.config.settings.Settings, the
# same source the application uses (ADR-0013: one settings mechanism).
script_location = migrations
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
